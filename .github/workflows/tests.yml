name: tests

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: install.py --dry-run against a scratch HOME
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/scratch-home"
          HOME="$RUNNER_TEMP/scratch-home" USERPROFILE="$RUNNER_TEMP/scratch-home" \
            python install.py --dry-run
